<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión | Cubika</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* RESET BÁSICO */
    * {
      box-sizing: border-box;
       font-family:Inter,sans-serif;
    }

    body {
      margin: 0;
      background-color: #f4f6f8; /* fallback */
      background-image: url("img/fondo.png");
      background-size: cover;          /* ajusta al tamaño de pantalla */
      background-position: center;     /* centra la imagen */
      background-repeat: no-repeat;    /* evita repetición */
      background-attachment: fixed;    /* opcional: efecto elegante */
    
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }


    .login-container {

      width:100%;
      max-width:440px;
    
      padding:40px;
    
      background:white;
    
      border-radius:16px;
    
      box-shadow:
        0 20px 40px rgba(0,0,0,.08);
    }

    .login-version {

        margin-top:24px;
    
        text-align:center;
    
        color:#94A3B8;
    
        font-size:12px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header img {
      width: 280px;
      margin-bottom: 20px;
    }

    .login-header h1 {
      font-size: 20px;
      margin: 0;
      color: #1f2933;
    }

    .login-header p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #374151;
    }

    input {

      width:100%;
    
      padding:12px 14px;
    
      border:1px solid #E2E8F0;
    
      border-radius:10px;
    
      font-size:14px;
    
      transition:all .2s ease;
    }
    
    input:focus {

        outline:none;
      
        border-color:#146C5B;
      
        box-shadow:
          0 0 0 3px rgba(20,108,91,.12);
      }

    .login-button {

        width:100%;
      
        padding:14px;
      
        background:#0B2F5B;
      
        color:white;
      
        border:none;
      
        border-radius:10px;
      
        font-size:15px;
      
        font-weight:600;
      
        cursor:pointer;
      
        transition:all .2s ease;
      }

    .login-button:hover {
    
      transform:translateY(-1px);
    
      box-shadow:
        0 6px 16px rgba(11,47,91,.18);
    }

    
    .login-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }

    .login-footer a {
      color: #2563eb;
      text-decoration: none;
    }

    .login-badge {

    display:inline-block;

    padding:6px 12px;

    background:#D7F3EA;

    color:#146C5B;

    border-radius:999px;

    font-size:12px;

    font-weight:600;

    margin-bottom:20px;
  }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none; /* visible solo si hay error */
    }


/* ESTADO LOADING */
.button-loading {
  opacity: 0.8;
  pointer-events: none;
}

/* INPUT ERROR */
.input-error {
  border-color: #dc2626;
}

/* MENSAJE INFO */
.message.info {
  background: #e0f2fe;
  color: #075985;
}

/* TRANSICIÓN SUAVE */
button,
input {
  transition: all 0.2s ease;
}


/* ================================
   VISUALIZADOR DE CONTRASEÑA
================================ */

.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 46px;
}

.toggle-password {
  position: absolute;

  right: 8px;
  top: 50%;

  transform: translateY(-50%);

  width: 34px;
  height: 34px;

  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  border: none;

  color: #64748B;

  cursor: pointer;

  border-radius: 8px;

  transition:
    color .2s ease,
    background-color .2s ease;
}

.toggle-password:hover {
  color: #146C5B;
  background-color: #F1F5F9;
}

.toggle-password:focus {
  outline: none;

  box-shadow:
    0 0 0 3px rgba(20,108,91,.12);
}

.password-icon {
  width: 18px;
  height: 18px;

  display: block;
}
    
  </style>
</head>

<body>

  
  <div class="login-container">

    
    
    <div class="login-header">
      
      <a href="/">
        
      <img src="img/isologo-1.png" alt="Cubika" />
      </a>
      <p>Plataforma de soluciones Logísticas Inteligentes</p>
      <br>
      <h1>Iniciar sesión</h1>
      
    </div>

    <!-- Mensaje de error (controlado por JS en el futuro) -->
    <div class="error-message" id="loginError">
      Credenciales inválidas. Intenta nuevamente.
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="usuario@empresa.com" required />
      </div>


      <div class="form-group">
        
          <label for="password">
            Contraseña
          </label>
        
          <div class="password-wrapper">
        
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
        
            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar contraseña"
              title="Mostrar contraseña">
          
              <svg
                  class="password-icon icon-eye"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
          
                  <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z">
                  </path>
          
                  <circle
                      cx="12"
                      cy="12"
                      r="2.5">
                  </circle>
          
              </svg>
          
          </button>
        
          </div>
        
        </div>
      

      <button type="submit" class="login-button">
        Ingresar
      </button>

    </form>

    <div class="login-footer">
      <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="login-version">

    Cubika Portal · Versión 1.0

  </div>

  </div>


<script>
  function setLoading(form, isLoading, loadingText = "Procesando...") {
    const button = form.querySelector(".login-button");
    const inputs = form.querySelectorAll("input");

    if (isLoading) {
      button.dataset.originalText = button.innerText;
      button.innerText = loadingText;
      button.classList.add("button-loading");
      button.disabled = true;
      inputs.forEach(input => input.disabled = true);
    } else {
      button.innerText = button.dataset.originalText;
      button.classList.remove("button-loading");
      button.disabled = false;
      inputs.forEach(input => input.disabled = false);
    }
  }

  function showMessage(id) {
    document.querySelectorAll(".message").forEach(m => m.style.display = "none");
    if (!id) return;
    const el = document.getElementById(id);
    if (el) el.style.display = "block";
  }

  function clearErrors(form) {
    form.querySelectorAll("input").forEach(input => {
      input.classList.remove("input-error");
    });
  }
</script>


<script>
  const passwordInput =
    document.getElementById("password");

  const togglePassword =
    document.getElementById("togglePassword");


  const iconEye = `
    <svg
      class="password-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">

      <path
        d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z">
      </path>

      <circle
        cx="12"
        cy="12"
        r="2.5">
      </circle>

    </svg>
  `;


  const iconEyeOff = `
    <svg
      class="password-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">

      <path
        d="M3 3l18 18">
      </path>

      <path
        d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17.8 17.8 0 0 1-3.2 3.8">
      </path>

      <path
        d="M6.2 6.7C3.8 8.3 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8">
      </path>

      <path
        d="M9.9 9.9a3 3 0 0 0 4.2 4.2">
      </path>

    </svg>
  `;


  togglePassword?.addEventListener(
    "click",
    () => {

      const mostrar =
        passwordInput.type === "password";


      passwordInput.type =
        mostrar
          ? "text"
          : "password";


      togglePassword.innerHTML =
        mostrar
          ? iconEyeOff
          : iconEye;


      togglePassword.setAttribute(
        "aria-label",
        mostrar
          ? "Ocultar contraseña"
          : "Mostrar contraseña"
      );


      togglePassword.setAttribute(
        "title",
        mostrar
          ? "Ocultar contraseña"
          : "Mostrar contraseña"
      );

    }
  );
</script>
  
  

<script type="module" src="/login.js"></script>

</body>
</html>
