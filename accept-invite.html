<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <title>Activar cuenta | Cubika</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;

      padding: 32px;

      background: #ffffff;

      border-radius: 8px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header img {
      width: 140px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      color: #1f2933;
    }

    .header p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }

    .info-box {
      background: #f9fafb;

      border: 1px solid #e5e7eb;

      padding: 14px;

      border-radius: 6px;

      font-size: 13px;

      margin-bottom: 20px;

      line-height: 1.7;
    }

    .info-box strong {
      color: #1f2933;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;

      font-size: 13px;

      margin-bottom: 6px;

      color: #374151;
    }

    input {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #d1d5db;

      border-radius: 6px;

      font-size: 14px;

      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;

      border-color: #2563eb;
    }

    input[readonly] {
      background: #f3f4f6;

      cursor: not-allowed;
    }

    button {
      width: 100%;

      padding: 12px;

      background: #2563eb;

      color: #ffffff;

      border: none;

      border-radius: 6px;

      font-size: 15px;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.92;
    }

    button:disabled {
      background: #9ca3af;

      cursor: not-allowed;
    }

    .message {
      padding: 12px;

      border-radius: 6px;

      font-size: 13px;

      margin-bottom: 16px;

      display: none;

      line-height: 1.5;
    }

    .message.error {
      background: #fee2e2;

      color: #991b1b;
    }

    .message.success {
      background: #ecfdf5;

      color: #065f46;
    }

    .message.info {
      background: #e0f2fe;

      color: #075985;
    }

    .password-hint {
      font-size: 12px;

      color: #6b7280;

      margin-top: 6px;

      line-height: 1.4;
    }

    .button-loading {
      opacity: 0.8;

      pointer-events: none;
    }

    .input-error {
      border-color: #dc2626;
    }

    #activateForm {
      display: none;
    }

  </style>

</head>


<body>


  <div class="card">


    <div class="header">

      <img
        src="img/isologo-2.png"
        alt="Cubika"
      />

      <h1>
        Activar cuenta
      </h1>

      <p>
        Completa los datos para comenzar a usar Cubika
      </p>

    </div>


    <!-- Información del usuario -->

    <div
      class="info-box"
      id="userInfo"
      style="display:none;"
    >

      <div>
        <strong>Empresa:</strong>
        <span id="companyName"></span>
      </div>

      <div>
        <strong>Usuario:</strong>
        <span id="userName"></span>
      </div>

      <div>
        <strong>Correo:</strong>
        <span id="userEmail"></span>
      </div>

      <div>
        <strong>Cargo:</strong>
        <span id="userRole"></span>
      </div>

    </div>


    <!-- Mensajes -->

    <div
      class="message error"
      id="errorMessage"
    ></div>


    <div
      class="message success"
      id="successMessage"
    >
      Cuenta activada correctamente.
      Redirigiendo al inicio de sesión…
    </div>


    <div
      class="message info"
      id="loadingMessage"
      style="display:block;"
    >
      Verificando invitación…
    </div>


    <!-- Formulario -->

    <form id="activateForm">


      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="••••••••••"
          autocomplete="new-password"
          required
        />

        <div class="password-hint">
          Mínimo 10 caracteres.
          Se recomienda combinar letras, números y símbolos.
        </div>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirmar contraseña
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="••••••••••"
          autocomplete="new-password"
          required
        />

      </div>


      <button type="submit">
        Activar cuenta
      </button>


    </form>


  </div>


<script type="module">

  import { supabase }
  from "./js/supabaseClient.js";


  const activateForm =
    document.getElementById("activateForm");

  const loadingMessage =
    document.getElementById("loadingMessage");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const userInfo =
    document.getElementById("userInfo");


  /*
   * --------------------------------------------------
   * UTILIDADES
   * --------------------------------------------------
   */


  function showMessage(
    type,
    message
  ) {

    loadingMessage.style.display = "none";

    errorMessage.style.display = "none";

    successMessage.style.display = "none";


    if (type === "error") {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

    }


    if (type === "success") {

      successMessage.textContent =
        message;

      successMessage.style.display =
        "block";

    }


    if (type === "info") {

      loadingMessage.textContent =
        message;

      loadingMessage.style.display =
        "block";

    }

  }


  function setLoading(
    isLoading
  ) {

    const button =
      activateForm.querySelector("button");

    const inputs =
      activateForm.querySelectorAll("input");


    if (isLoading) {

      button.dataset.originalText =
        button.innerText;

      button.innerText =
        "Activando cuenta...";

      button.disabled = true;

      inputs.forEach(
        input =>
          input.disabled = true
      );

    }
    else {

      button.innerText =
        button.dataset.originalText;

      button.disabled = false;

      inputs.forEach(
        input =>
          input.disabled = false
      );

    }

  }


  function clearErrors() {

    activateForm
      .querySelectorAll("input")
      .forEach(input => {

        input.classList.remove(
          "input-error"
        );

      });

  }


  /*
   * --------------------------------------------------
   * CARGAR INFORMACIÓN DE LA INVITACIÓN
   * --------------------------------------------------
   */


  async function cargarInvitacion() {

    try {

      /*
       * 1. Obtener sesión creada
       *    por el enlace de invitación
       */

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabase.auth.getSession();


      if (sessionError)
        throw sessionError;


      const session =
        sessionData.session;


      if (!session) {

        showMessage(
          "error",
          "El enlace de invitación es inválido o ha expirado."
        );

        return;

      }


      /*
       * 2. Obtener usuario autenticado
       */

      const {
        data: userData,
        error: userError
      } =
        await supabase.auth.getUser();


      if (userError)
        throw userError;


      const authUser =
        userData.user;


      if (!authUser) {

        showMessage(
          "error",
          "No fue posible identificar la cuenta invitada."
        );

        return;

      }


      /*
       * 3. Buscar usuario en public.usuarios
       */

      const {
        data: usuario,
        error: usuarioError
      } =
        await supabase
          .from("usuarios")
          .select(`
            id,
            empresa_id,
            nombre,
            apellido,
            email,
            cargo,
            nivel,
            estado
          `)
          .eq(
            "auth_user_id",
            authUser.id
          )
          .single();


      if (usuarioError)
        throw usuarioError;


      if (!usuario) {

        showMessage(
          "error",
          "No encontramos el registro de usuario asociado a esta invitación."
        );

        return;

      }

/*
       * --------------------------------------------------
       * 4. Obtener empresa
       * --------------------------------------------------
       */
      
     const {
          data: empresa,
          error: empresaError
        } = await supabase
          .from("empresas")
          .select("id, razon_social, nombre_fantasia")
          .eq("id", usuario.empresa_id)
          .single();
        
        if (empresaError) {
          throw empresaError;
        }
        
        if (!empresa) {
          throw new Error(
            "No fue posible encontrar la empresa asociada a esta cuenta."
          );
        }
      
      
        return;
      
      }

            /*
       * --------------------------------------------------
       * 5. Mostrar información
       * --------------------------------------------------
       */
      
      document.getElementById(
        "companyName"
      ).textContent =
      empresa.nombre_fantasia ||
      empresa.razon_social ||
      "—";
      
      
      document.getElementById(
        "userName"
      ).textContent =
        `${usuario.nombre ?? ""} ${usuario.apellido ?? ""}`.trim();
      
      
      document.getElementById(
        "userEmail"
      ).textContent =
        usuario.email ?? authUser.email ?? "—";
      
      
      document.getElementById(
        "userRole"
      ).textContent =
        usuario.cargo ?? "—";
      
      
      userInfo.style.display =
        "block";
      
      
      loadingMessage.style.display =
        "none";
      
      
      activateForm.style.display =
        "block";

      
      /*
       * 6. Mostrar formulario
       */

      loadingMessage.style.display =
        "none";

      activateForm.style.display =
        "block";

    }

    catch (error) {

      console.error(
        "Error cargando invitación:",
        error
      );

      showMessage(
        "error",
        "No fue posible validar la invitación. Intenta nuevamente o solicita una nueva invitación al administrador."
      );

    }

  }


  /*
   * --------------------------------------------------
   * ACTIVAR CUENTA
   * --------------------------------------------------
   */


  activateForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      clearErrors();


      const password =
        document.getElementById(
          "password"
        );

      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        );


      /*
       * Validaciones
       */

      if (
        password.value.length < 10
      ) {

        password.classList.add(
          "input-error"
        );

        showMessage(
          "error",
          "La contraseña debe tener al menos 10 caracteres."
        );

        return;

      }


      if (
        password.value !==
        confirmPassword.value
      ) {

        password.classList.add(
          "input-error"
        );

        confirmPassword.classList.add(
          "input-error"
        );

        showMessage(
          "error",
          "Las contraseñas no coinciden."
        );

        return;

      }


      try {

        setLoading(true);


        /*
         * 1. Establecer contraseña
         */

        const {
          error: passwordError
        } =
          await supabase.auth.updateUser({

            password:
              password.value

          });


        if (passwordError)
          throw passwordError;


        /*
         * 2. Obtener usuario autenticado
         */

        const {
          data: userData,
          error: userError
        } =
          await supabase.auth.getUser();


        if (userError)
          throw userError;


        const authUser =
          userData.user;


        /*
         * 3. Actualizar estado
         */

        const {
          error: updateError
        } =
          await supabase
            .from("usuarios")
            .update({

              estado: "ACTIVO",

              updated_at:
                new Date().toISOString()

            })
            .eq(
              "auth_user_id",
              authUser.id
            );


        if (updateError)
          throw updateError;


        /*
         * 4. Mostrar éxito
         */

        setLoading(false);

        activateForm.style.display =
          "none";

        userInfo.style.display =
          "none";


        showMessage(
          "success",
          "Cuenta activada correctamente. Redirigiendo al inicio de sesión…"
        );


        /*
         * 5. Cerrar sesión
         *
         * El usuario deberá iniciar sesión
         * normalmente desde el Login.
         */

        await supabase.auth.signOut();


        setTimeout(() => {

          window.location.href =
            "/login.html";

        }, 1800);

      }

      catch (error) {

        console.error(
          "Error activando cuenta:",
          error
        );

        setLoading(false);

        showMessage(
          "error",
          error.message ||
          "No fue posible activar la cuenta."
        );

      }

    }
  );


  /*
   * --------------------------------------------------
   * INICIO
   * --------------------------------------------------
   */

  cargarInvitacion();

</script>


</body>
</html>
