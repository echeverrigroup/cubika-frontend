<!DOCTYPE html>
<html lang="es">

<style>

/* ================= HEADER ================= */

.main-header {
  width: 100%;
  background: #fff;
  border-bottom: 1px solid #eee;
}

.header-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 7px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-logo img {
  height: 66px;
}

.header-nav {
  display: flex;
  gap: 42px;
}

.header-nav a {
  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  color: #0a2540;
}

.header-actions .btn-login {
  background: #0b2b4b;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 19px;
  font-weight: 600;
}

.menu-toggle {
  display: none;
  font-size: 36px;
  cursor: pointer;
}

    
</style>
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cubika Portal</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navbar -->
    <header class="header-logo">

        <div class="navbar-left">
            <img src="../img/isologo-1.png" alt="Cubika">
        </div>

        <div class="navbar-right">
            <span id="usuario-logueado">
                Usuario
            </span>
        </div>

    </header>

    <!-- Contenido principal -->
    <div class="main-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h3>Administración</h3>

            <ul>
                <li>Dashboard</li>
                <li>Empresas</li>
                <li>Sucursales</li>
                <li>Usuarios</li>
            </ul>

            <h3>Operaciones</h3>

            <ul>
                <li>Bodegas</li>
                <li>Ubicaciones</li>
                <li>Productos</li>
            </ul>

            <h3>Inventario</h3>

            <ul>
                <li>Stock</li>
                <li>Movimientos</li>
            </ul>

        </aside>

        <!-- Área de trabajo -->
        <main class="content">

            <h1>Dashboard Cubika</h1>

            <p>
                Bienvenido al portal de administración.
            </p>

        </main>

    </div>

</body>

</html>
