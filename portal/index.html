<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cubika Portal</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

    <header class="navbar">

        <div class="navbar-left">
            <img src="../img/isolog-1.png" alt="Cubika" class="logo">

        <div class="navbar-right">
            <span id="usuario-logueado">
                Usuario
            </span>
        </div>

    </header>

    <!-- Contenido principal -->

            <ul>

            <h3>Operaciones</h3>

            <ul>
                <li>Bodegas</li>
                <li>Ubicaciones</li>
                <li>Productos</li>
            </ul>

            <h3>Inventario</h3>

            <ul>
                <li>Stock</li>
                <li>Movimientos</li>
            </ul>

        </aside>

        <!-- Área de trabajo -->
        <main class="content">

            <h1>Dashboard Cubika</h1>

            <p>

        </main>
